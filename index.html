<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T-Rex Runner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrapper" role="main">
      <div class="hud" aria-live="polite">
        <span class="hud__label">SCORE</span>
        <span class="hud__value" id="score">00000</span>
        <span class="hud__label hud__label--best">BEST</span>
        <span class="hud__value" id="best-score">00000</span>
      </div>

      <canvas id="game-canvas" width="800" height="300" aria-label="T-Rex game canvas"></canvas>

      <div class="overlay" id="overlay">
        <p class="overlay__message" id="overlay-message">Press Space or Tap to Start</p>
        <button class="overlay__btn" id="overlay-btn" type="button">START</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
