<svg xmlns="http://www.w3.org/2000/svg" width="59" height="30" viewBox="0 0 59 30">
  <!-- Head (horizontal/forward) -->
  <rect x="38" y="2" width="19" height="10" fill="#2e7d32"/>
  <!-- Brow -->
  <rect x="53" y="2" width="4" height="2" fill="#2e7d32"/>
  <!-- Eye (white) -->
  <rect x="51" y="4" width="4" height="4" fill="white"/>
  <!-- Jaw -->
  <rect x="55" y="10" width="3" height="2" fill="#2e7d32"/>
  <!-- Neck -->
  <rect x="30" y="4" width="10" height="8" fill="#2e7d32"/>
  <!-- Body -->
  <rect x="4" y="10" width="30" height="14" fill="#2e7d32"/>
  <!-- Neck-body connector -->
  <rect x="30" y="10" width="10" height="5" fill="#2e7d32"/>
  <!-- Tail -->
  <rect x="2" y="11" width="4" height="5" fill="#2e7d32"/>
  <rect x="1" y="14" width="4" height="7" fill="#2e7d32"/>
  <!-- Arm -->
  <rect x="30" y="13" width="8" height="3" fill="#2e7d32"/>
  <!-- Left leg: forward -->
  <rect x="8" y="24" width="6" height="5" fill="#2e7d32"/>
  <rect x="5" y="27" width="7" height="3" fill="#2e7d32"/>
  <!-- Right leg: back -->
  <rect x="18" y="24" width="6" height="4" fill="#2e7d32"/>
  <rect x="17" y="27" width="6" height="3" fill="#2e7d32"/>
</svg>
