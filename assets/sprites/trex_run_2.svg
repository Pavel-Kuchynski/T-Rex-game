<svg xmlns="http://www.w3.org/2000/svg" width="44" height="47" viewBox="0 0 44 47">
  <!-- Head -->
  <rect x="20" y="2" width="22" height="12" fill="#2e7d32"/>
  <!-- Brow bump -->
  <rect x="38" y="2" width="4" height="2" fill="#2e7d32"/>
  <!-- Eye (white) -->
  <rect x="36" y="5" width="4" height="4" fill="white"/>
  <!-- Jaw -->
  <rect x="40" y="12" width="3" height="2" fill="#2e7d32"/>
  <!-- Neck -->
  <rect x="16" y="12" width="8" height="7" fill="#2e7d32"/>
  <!-- Body -->
  <rect x="2" y="17" width="22" height="16" fill="#2e7d32"/>
  <!-- Neck-body connector -->
  <rect x="16" y="17" width="8" height="4" fill="#2e7d32"/>
  <!-- Tail -->
  <rect x="2" y="19" width="4" height="5" fill="#2e7d32"/>
  <rect x="1" y="22" width="4" height="7" fill="#2e7d32"/>
  <!-- Arms -->
  <rect x="22" y="20" width="8" height="4" fill="#2e7d32"/>
  <rect x="26" y="24" width="4" height="3" fill="#2e7d32"/>
  <!-- Left leg: back/raised -->
  <rect x="7" y="33" width="6" height="7" fill="#2e7d32"/>
  <rect x="7" y="38" width="5" height="3" fill="#2e7d32"/>
  <!-- Right leg: forward/down -->
  <rect x="15" y="33" width="6" height="9" fill="#2e7d32"/>
  <rect x="13" y="40" width="8" height="4" fill="#2e7d32"/>
</svg>
